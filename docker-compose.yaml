services:
  postgres-service:
    image: postgres:15
    container_name: dev_postgres_db
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./infra/pgdata:/var/lib/postgresql/data


  mongodb-service:
    build:
      context: ./infra/mongo
      dockerfile: Dockerfile
    container_name: dev_mongo_db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
      MONGO_INITDB_DATABASE: ${MONGO_DB}

      MONGO_APP_USER: ${APP_USER}
      MONGO_APP_PASS: ${APP_PASSWORD}

    ports:
      - "27017:27017"
    volumes:
      - ./infra/mongo/mongodata:/data/db
    

  qdrant-service:
    image: qdrant/qdrant:latest
    container_name: dev_qdrant_service
    ports:
      - "6333:6333"
    volumes:
      - ./infra/qdrant_data:/qdrant/storage:z
  

  minio-service:
    image: minio/minio:latest
    container_name: dev_minio_service
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - ./infra/minio_data:/data
  
  broker:
    image: redis:7.2-alpine
    container_name: dev_redis_broker
    ports:
      - "6379:6379"
    volumes:
      - ./infra/redis_data:/data


# ------- Build Python runtime Base Image -------
  base:
    build:
      context: .
      dockerfile: infra/docker/base.dockerfile
    image: python_base:latest
    

  # web-app
  fastapi-app:
    build:  
      context: .
      dockerfile: infra/docker/api.dockerfile
      additional_contexts:
        python_runtime: service:base
    container_name: dev_fastapi_app
    ports:
      - "8000:8000"
    depends_on:
      - base
      - postgres-service
      - mongodb-service
      - qdrant-service
      - minio-service
      - broker
    volumes:
      - ./app:/code/app
      - ./logs:/code/logs
    env_file:
      - .env
  
  # Celery worker
  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.dockerfile
      additional_contexts:
        python_runtime: service:base
    container_name: dev_celery_worker
    depends_on:
      - base
      - broker
    env_file:
      - .env
    volumes:
      - ./app:/code/app
      - ./logs:/code/logs
